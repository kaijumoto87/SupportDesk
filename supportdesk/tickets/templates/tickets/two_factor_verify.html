{% load static %}<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{% static 'styles.css' %}"><link rel="stylesheet" href="{% static 'auth.css' %}"><title>Two-factor verification</title></head><body class="signed-out"><main><section class="content"><div class="auth-shell"><section class="auth-card"><div class="auth-copy"><small>SECURITY CHECK</small><h1>Authentication code</h1><p>Enter the six-digit code from your authenticator app.</p></div>{% for message in messages %}<div class="server-message error">{{ message }}</div>{% endfor %}<form class="auth-form" method="post">{% csrf_token %}<label>Verification code<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus></label><button class="primary auth-submit">Verify and sign in</button></form></section></div></section></main></body></html>
