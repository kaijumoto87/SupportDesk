{% load static %}<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{% static 'styles.css' %}"><link rel="stylesheet" href="{% static 'auth.css' %}"><title>Choose password</title></head><body class="signed-out"><main><section class="content"><div class="auth-shell"><section class="auth-card"><div class="auth-copy"><h1>Choose a new password</h1></div>{% if validlink %}<form class="auth-form" method="post">{% csrf_token %}{{ form.as_p }}<button class="primary auth-submit">Update password</button></form>{% else %}<p>This reset link is invalid or has expired.</p>{% endif %}</section></div></section></main></body></html>
